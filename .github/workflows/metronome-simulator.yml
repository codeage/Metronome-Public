name: Metronome simulator tests
on:
  push:
    branches: [qa/metronome-simulator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        profile: [pro, compact]
    env:
      SIMULATOR_PROFILE: ${{ matrix.profile }}
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select and boot iPhone
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          device="$(python3 - "$RUNNER_TEMP/devices.json" "$SIMULATOR_PROFILE" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as listing:
              runtimes = json.load(listing)["devices"]
          releases = [key for key in runtimes if ".iOS-" in key]
          releases.sort(key=lambda key: tuple(map(int, key.split(".iOS-", 1)[1].split("-"))))
          devices = [device for release in releases for device in runtimes[release]]
          names = ["iPhone 17 Pro"] if sys.argv[2] == "pro" else ["iPhone 17e", "iPhone 16e", "iPhone 17"]
          for name in names:
              if (matches := [d for d in devices if d["name"] == name]):
                  print(matches[-1]["udid"])
                  print("Selected " + name, file=sys.stderr)
                  break
          else:
              raise SystemExit(f"Could not find any of {names}")
          PY
          )"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build the app and test bundles
        timeout-minutes: 9
        run: |
          set -euo pipefail
          xcodebuild -project PianoMetronome.xcodeproj -scheme PianoMetronome \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/MetronomeSim" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-build.log"
      - name: Wait for iOS and install the app
        timeout-minutes: 4
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/MetronomeSim/Build/Products/Debug-iphonesimulator/PianoMetronome.app"
      - name: Run XCTest serially
        timeout-minutes: 10
        run: |
          set -euo pipefail
          set --
          if [[ "$SIMULATOR_PROFILE" == "compact" ]]; then
            set -- -only-testing:MetronomeUITests
          fi
          xcodebuild -project PianoMetronome.xcodeproj -scheme PianoMetronome \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/MetronomeSim" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/MetronomeTests.xcresult" \
            "$@" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Exercise playback URL on the simulator
        if: success() && matrix.profile == 'pro'
        run: |
          set -euo pipefail
          xcrun simctl terminate "$DEVICE" com.bytereset.metronome || true
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/MetronomeSim/Build/Products/Debug-iphonesimulator/PianoMetronome.app"
          xcrun simctl launch "$DEVICE" com.bytereset.metronome --metronome-layout-preview
          sleep 2
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/metronome-idle.png"
          xcrun simctl openurl "$DEVICE" 'bytereset-metronome://start?bpm=137&beats=5&unit=4'
          sleep 2
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/metronome-playing.png"
          xcrun simctl openurl "$DEVICE" 'bytereset-metronome://stop'
      - name: Record XCTest result totals
        if: always()
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/MetronomeTests.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result" > "$RUNNER_TEMP/test-summary.json"
            {
              echo '### XCTest results'
              echo '```json'
              cat "$RUNNER_TEMP/test-summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metronome-simulator-results-${{ matrix.profile }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/MetronomeTests.xcresult
            ${{ runner.temp }}/xcodebuild-build.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/test-summary.json
            ${{ runner.temp }}/metronome-*.png
