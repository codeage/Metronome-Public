name: Verify offline score catalog

on:
  workflow_dispatch:
    inputs:
      build_number:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise the published search and PDF loader
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sqlite3
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          db = temp/'score-fixture.sqlite'
          c = sqlite3.connect(db)
          c.executescript("""
          CREATE TABLE scores(score_id,title,composer,instruments,search_title,search_text);
          CREATE TABLE score_pdf(score_id PRIMARY KEY,content BLOB);
          INSERT INTO scores VALUES ('12', 'Violin Sonata', 'Composer', 'Violin', 'violin sonata', ' violin sonata composer violin ');
          INSERT INTO scores VALUES ('15', 'Piano Study', '', 'Piano', 'piano study', ' piano study piano ');
          """)
          parts = [b'<< /Type /Catalog /Pages 2 0 R >>', b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>', b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 300 300] >>']
          pdf = bytearray(b'%PDF-1.4\n')
          offsets = []
          for number, part in enumerate(parts, 1):
              offsets.append(len(pdf))
              pdf += f'{number} 0 obj\n'.encode() + part + b'\nendobj\n'
          xref = len(pdf)
          pdf += b'xref\n0 4\n0000000000 65535 f \n'
          for offset in offsets:
              pdf += f'{offset:010d} 00000 n \n'.encode()
          pdf += f'trailer\n<< /Root 1 0 R /Size 4 >>\nstartxref\n{xref}\n%%EOF\n'.encode()
          c.execute('INSERT INTO score_pdf VALUES (?,?)', ('12',bytes(pdf)))
          c.commit()
          source=Path('PianoMetronome/ScoreSearch.swift').read_text(encoding='utf-8-sig').split('struct ScorePDFSheet')[0]
          source=source.replace('URL.documentsDirectory.appending(path: "PDMXScoreCatalog.sqlite")', 'URL(fileURLWithPath: ProcessInfo.processInfo.environment["PDMX_TEST_DB"]!)')
          source += """
          @main struct ScoreCheck {
              static func main() async throws {
                  let violin = try await ScoreCatalog.shared.search("violin")
                  precondition(violin.count == 1 && violin.first?.instruments == "Violin")
                  let composer = try await ScoreCatalog.shared.search("sonat composer")
                  precondition(composer.first?.id == "12")
                  let nonexistent = try await ScoreCatalog.shared.search("no such work")
                  precondition(nonexistent.isEmpty)
                  let data = try await ScoreCatalog.shared.pdf(for: "12")
                  precondition(PDFDocument(data: data)?.pageCount == 1)
                  print("Search, instrument label and offline PDF verified")
              }
          }
          """
          (temp/'score-check.swift').write_text(source,encoding='utf-8')
          PY
          swiftc -swift-version 6 -parse-as-library "$RUNNER_TEMP/score-check.swift" -o "$RUNNER_TEMP/score-check"
          PDMX_TEST_DB="$RUNNER_TEMP/score-fixture.sqlite" "$RUNNER_TEMP/score-check"
      - name: Compile iOS app and run XCTest
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for arr in json.load(sys.stdin)["devices"].values() for d in arr if d["name"]=="iPhone 17 Pro"]; print(ds[-1]["udid"])')"
          xcrun simctl boot "$device"
          xcodebuild -project PianoMetronome.xcodeproj -scheme PianoMetronome \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/MetronomeSim" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -quiet test