name: Build Metronome for iOS
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: One-time public recipient for the result
        required: true
        type: string
permissions:
  contents: read
jobs:
  device-build:
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile encrypted device build
        env:
          INPUT_IDENTITY: ${{ secrets.METRONOME_DEVICE_INPUT_11 }}
          RESULT_RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          [[ "$RESULT_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]
          build_scope="$(mktemp -d "$RUNNER_TEMP/metronome-device.XXXXXX")"
          trap 'rm -rf "$build_scope"' EXIT
          chmod 700 "$build_scope"
          cd "$build_scope"
          curl -fsSL --retry 3 -o age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-darwin-arm64.tar.gz
          printf '%s  age.tar.gz\n' e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5 | shasum -a 256 --check
          tar -xzf age.tar.gz age/age
          mkdir source result
          printf '%s\n' "$INPUT_IDENTITY" > identity.txt
          ./age/age --decrypt --identity identity.txt --output source.tar.gz "$GITHUB_WORKSPACE/device-build.age"
          rm -f identity.txt
          unset INPUT_IDENTITY
          tar -xzf source.tar.gz -C source
          status=0
          (
            cd source
            xcodebuild -version
            xcodebuild -project PianoMetronome.xcodeproj -scheme PianoMetronome \
              -configuration Release -destination 'generic/platform=iOS' \
              -derivedDataPath "$build_scope/derived" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=11 build
          ) > result/build.log 2>&1 || status=$?
          if [[ "$status" == 0 ]]; then
            app="$build_scope/derived/Build/Products/Release-iphoneos/PianoMetronome.app"
            test -x "$app/PianoMetronome"
            test -x "$app/PlugIns/MetronomeActivity.appex/MetronomeActivity"
            mkdir Payload
            ditto "$app" Payload/PianoMetronome.app
            zip -qr result/Build11.ipa Payload
            unzip -tq result/Build11.ipa
          fi
          tar -czf result.tar.gz -C result .
          ./age/age --encrypt --recipient "$RESULT_RECIPIENT" --output "$RUNNER_TEMP/device-build-result.age" result.tar.gz
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metronome-encrypted-device-build
          path: ${{ runner.temp }}/device-build-result.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
