name: Build Metronome for iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    name: Upload signed Build 29924095 to TestFlight
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Decrypt, verify and upload to App Store Connect
        env:
          RELEASE_AGE_KEY: ${{ secrets.METRONOME_TF_INPUT_29924095_D8DEB1 }}
        run: |
          set -euo pipefail
          : "${RELEASE_AGE_KEY:?The one-time upload key is missing}"
          work=$(mktemp -d "$RUNNER_TEMP/metronome-delivery.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_AGE_KEY" > "$work/key"
          unset RELEASE_AGE_KEY
          curl -fsSL --retry 3 -o "$work/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-darwin-arm64.tar.gz
          printf '%s  %s\n' e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5 "$work/age.tar.gz" | shasum -a 256 --check
          tar -xzf "$work/age.tar.gz" -C "$work" age/age
          ipa="$work/Metronome-29924095-TestFlight.ipa"
          "$work/age/age" --decrypt --identity "$work/key" --output "$ipa" signed-ipa.age
          printf '%s  %s\n' f5a5f0d46f4a360a4f0f620b170136d8c2ddef5ae57275936d2f0a1e2460a674 "$ipa" | shasum -a 256 --check
          unzip -tq "$ipa"
          xcodebuild -version
          APPLE_APP_SPECIFIC_PASSWORD=$("$work/age/age" --decrypt --identity "$work/key" auth.age)
          printf '::add-mask::%s\n' "$APPLE_APP_SPECIFIC_PASSWORD"
          export APPLE_APP_SPECIFIC_PASSWORD
          rm -f -- "$work/key"
          xcrun altool --upload-app --type ios --file "$ipa" --username '6474024@qq.com' \
            --password '@env:APPLE_APP_SPECIFIC_PASSWORD' --output-format json | tee "$work/upload.json"
          delivery=$(jq -r '.. | objects | to_entries[] | select(.key | test("^delivery[-_ ]?(id|uuid)$";"i")) | .value | strings' "$work/upload.json" | head -n 1)
          if [[ "$delivery" =~ ^[[:xdigit:]-]{36}$ ]]; then
            xcrun altool --build-status --delivery-id "$delivery" --wait \
              --provider-public-id '69a6de76-d94e-47e3-e053-5b8c7c11a4d1' \
              --username '6474024@qq.com' --password '@env:APPLE_APP_SPECIFIC_PASSWORD' --output-format normal
          fi