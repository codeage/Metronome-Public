name: Build Metronome for iOS

on:
  workflow_dispatch:
    inputs:
      build_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  audio-comparison:
    if: github.ref == 'refs/heads/codex/metronome-audio-comparison'
    runs-on: macos-26
    timeout-minutes: 18
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      VARIANT_LABEL: A
      BUNDLE_SUFFIX: audioa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set comparison bundle identifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path("PianoMetronome.xcodeproj/project.pbxproj")
          source = project.read_text(encoding="utf-8-sig")
          base = "com.bytereset.metronome"
          for tail in ("", ".liveactivity"):
              old = f"PRODUCT_BUNDLE_IDENTIFIER = {base}{tail};"
              new = f"PRODUCT_BUNDLE_IDENTIFIER = {base}.{os.environ['BUNDLE_SUFFIX']}{tail};"
              assert source.count(old) == 2
              source = source.replace(old, new)
          project.write_text(source, encoding="utf-8-sig")
          PY
      - name: Compile iOS Release
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,7}$ ]]
          xcodebuild -version
          xcodebuild -project PianoMetronome.xcodeproj -scheme PianoMetronome \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/metronome-derived" CODE_SIGNING_ALLOWED=NO \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) METRONOME_AUDIO_COMPARISON' \
            -quiet build
      - name: Package standalone unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/metronome-derived/Build/Products/Release-iphoneos/PianoMetronome.app"
          test -x "$app/PianoMetronome"
          mkdir -p "$RUNNER_TEMP/metronome-device/Payload"
          cd "$RUNNER_TEMP/metronome-device"
          ditto "$app" Payload/PianoMetronome.app
          python3 - <<'PY'
          from pathlib import Path
          import os
          import plistlib
          import shutil

          app = Path("Payload/PianoMetronome.app")
          with (app / "Info.plist").open("rb") as file:
              info = plistlib.load(file)
          assert info["CFBundleIdentifier"] == "com.bytereset.metronome." + os.environ["BUNDLE_SUFFIX"]
          assert info["CFBundleVersion"] == os.environ["BUILD_NUMBER"]
          info["CFBundleDisplayName"] = "Metronome " + os.environ["VARIANT_LABEL"]
          info.pop("CFBundleURLTypes", None)
          info.pop("NSSupportsLiveActivities", None)
          with (app / "Info.plist").open("wb") as file:
              plistlib.dump(info, file, fmt=plistlib.FMT_BINARY)
          for strings in app.glob("*.lproj/InfoPlist.strings"):
              strings.unlink()
          if (app / "PlugIns").is_dir():
              shutil.rmtree(app / "PlugIns")
          PY
          zip -qr unsigned.ipa Payload
          unzip -tq unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metronome-unsigned-audio-A
          path: ${{ runner.temp }}/metronome-device/unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
