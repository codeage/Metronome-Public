name: Build Metronome for iOS

on:
  workflow_dispatch:
    inputs:
      build_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  device-build:
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile iOS Release
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,7}$ ]]
          xcodebuild -project PianoMetronome.xcodeproj -scheme PianoMetronome \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/metronome-derived" CODE_SIGNING_ALLOWED=NO \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/metronome-derived/Build/Products/Release-iphoneos/PianoMetronome.app"
          test -x "$app/PianoMetronome"
          test -x "$app/PlugIns/MetronomeActivity.appex/MetronomeActivity"
          mkdir -p "$RUNNER_TEMP/metronome-device/Payload"
          cd "$RUNNER_TEMP/metronome-device"
          ditto "$app" Payload/PianoMetronome.app
          zip -qr unsigned.ipa Payload
          unzip -tq unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metronome-unsigned-device-build
          path: ${{ runner.temp }}/metronome-device/unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
